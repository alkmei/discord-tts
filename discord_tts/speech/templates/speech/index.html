{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTS Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <style>
      body {
        background-color: #f8f9fa;
        font-family: 'Inter', sans-serif;
      }

      .editor-container {
        height: 500px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        overflow: hidden;
      }

      #editor {
        width: 100%;
        height: 100%;
      }

      /* Fixed: Added wrapping and better spacing for badges */
      .voice-badge {
        padding: 0.4em 0.8em;
        font-size: 0.75em;
        font-weight: 700;
        border-radius: 0.375rem;
        background-color: #e7f1ff;
        color: #0d6efd;
        margin: 4px;
        display: inline-block;
        border: 1px solid #cfe2ff;
      }

      .htmx-indicator {
        display: none;
      }

      .htmx-request .htmx-indicator {
        display: block;
      }
    </style>
  </head>
  <body>
    <nav class="navbar border-bottom mb-4 bg-white">
      <div class="container">
        <span class="navbar-brand mb-0 h1 text-primary">Discord TTS Dashboard</span>
      </div>
    </nav>
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card p-4 h-100 border-0 shadow-sm">
            <h5 class="fw-bold mb-3">📘 Instructions</h5>
            <p class="text-muted small">Prefix lines to change voices. Use the button to load server-specific voices.</p>
            <pre class="bg-light p-2"><code>alba: Hello!
alice: Hi there!</code></pre>
            <label class="small fw-bold text-uppercase text-muted mt-3">Available Voices</label>
            <!-- This container will now correctly hold generated badges -->
            <div id="available-voices" class="mt-2 d-flex flex-wrap">
              <span class="text-muted small italic">Enter a Guild ID and click Load</span>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card p-4 border-0 shadow-sm">
            <form hx-post="{% url 'speech:generate' %}"
                  hx-target="#result-area"
                  hx-indicator="#spinner">
              {% csrf_token %}
              <div class="mb-4">
                <label class="form-label fw-semibold">Discord Server ID</label>
                <!-- Submit button added next to Guild ID using input-group -->
                <div class="input-group">
                  <input type="text"
                         id="guild-id-input"
                         name="guild_id"
                         class="form-control"
                         placeholder="e.g. 123456789012345" />
                  <button class="btn btn-primary"
                          type="button"
                          id="load-voices-btn"
                          onclick="updateVoiceContext()">Load Voices</button>
                </div>
                <div id="voice-load-spinner"
                     class="spinner-border spinner-border-sm text-primary mt-2 d-none"></div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Discord Channel ID</label>
                <input type="text"
                       name="channel_id"
                       class="form-control"
                       placeholder="e.g. 123456789012345" />
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Script Editor</label>
                <div class="editor-container">
                  <div id="editor"></div>
                </div>
                <textarea name="text" id="hidden-text" style="display:none;"></textarea>
              </div>
              <div class="d-flex align-items-center justify-content-between">
                <button type="submit"
                        class="btn btn-success btn-lg px-5 shadow-sm"
                        onclick="syncEditorContent()">Broadcast to Discord</button>
                <div id="spinner" class="htmx-indicator">
                  <div class="d-flex align-items-center text-primary">
                    <div class="spinner-border spinner-border-sm me-2"></div>
                    <span class="small fw-bold">Processing...</span>
                  </div>
                </div>
              </div>
            </form>
            <div id="result-area" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
      let editor;
      const guildInput = document.getElementById('guild-id-input');
      const voiceBadgeContainer = document.getElementById('available-voices');
      const voiceSpinner = document.getElementById('voice-load-spinner');

      // Function to reload Monaco and generate proper HTML Badges
      async function updateVoiceContext() {
        const guildId = guildInput.value;
        if (!guildId) {
          alert("Please enter a Guild ID first.");
          return;
        }

        // Show loading state
        voiceSpinner.classList.remove('d-none');
        voiceBadgeContainer.innerHTML = '';

        try {
          const response = await fetch(`{% url 'speech:voice_list' %}?guild_id=${guildId}`);
          const voices = await response.json();

          // Clear and Generate Badges
          if (voices.length > 0) {
            voiceBadgeContainer.innerHTML = voices.map(v =>
              `<span class="voice-badge">${v}</span>`
            ).join('');
          } else {
            voiceBadgeContainer.innerHTML = '<span class="text-danger small">No voices found for this Guild ID.</span>';
          }

          // Initialize or Update Monaco
          if (!editor) {
            initMonaco(voices);
          } else {
            monaco.languages.setMonarchTokensProvider('tts-multi', createTokenProvider(voices));
          }
        } catch (error) {
          console.error("Error loading voices:", error);
          voiceBadgeContainer.innerHTML = '<span class="text-danger small">Error connecting to server.</span>';
        } finally {
          voiceSpinner.classList.add('d-none');
        }
      }

      function createTokenProvider(availableVoices) {
        return {
          voices: availableVoices,
          tokenizer: {
            root: [
              [/^([a-zA-Z_]+)(:)/, {
                cases: {
                  '$1@voices': ['voice.valid', 'delimiter'],
                  '@default': ['voice.invalid', 'delimiter']
                }
              }],
              [/.*$/, 'message']
            ]
          }
        };
      }

      function initMonaco(availableVoices) {
        require.config({
          paths: {
            vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'
          }
        });
        require(['vs/editor/editor.main'], function() {
          monaco.languages.register({
            id: 'tts-multi'
          });
          monaco.languages.setMonarchTokensProvider('tts-multi', createTokenProvider(availableVoices));

          monaco.editor.defineTheme('tts-light', {
            base: 'vs',
            inherit: true,
            rules: [{
              token: 'voice.valid',
              foreground: '0d6efd',
              fontStyle: 'bold'
            }, {
              token: 'voice.invalid',
              foreground: 'dc3545',
              fontStyle: 'bold'
            }, {
              token: 'message',
              foreground: '198754'
            }],
            colors: {
              'editor.background': '#ffffff'
            }
          });

          editor = monaco.editor.create(document.getElementById('editor'), {
            value: 'alba: Hello!',
            language: 'tts-multi',
            theme: 'tts-light',
            automaticLayout: true,
            minimap: {
              enabled: false
            },
            wordWrap: 'on'
          });
        });
      }

      // Initial Monaco load with empty voices
      window.onload = () => {
        initMonaco([]);
      };

      function syncEditorContent() {
        if (editor) document.getElementById('hidden-text').value = editor.getValue();
      }
    </script>
  </body>
</html>
