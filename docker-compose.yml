services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

  bot:
    build: .
    image: discord-tts-app:latest
    volumes:
      - ./voices:/app/voices
      - shared_data:/app/shared
    env_file: .env
    depends_on:
      - rabbitmq
    restart: always
    command: python -m bot.main

  worker:
    image: discord-tts-app:latest
    volumes:
      - ./voices:/app/voices
      - shared_data:/app/shared
    env_file: .env
    depends_on:
      - rabbitmq
    restart: always
    # If using a GPU, you'll need additional nvidia-docker config here
    command: celery -A worker.tasks worker --loglevel=info --concurrency=1
  
  webui:
    image: discord-tts-app:latest
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./voices:/app/voices
      - shared_data:/app/shared
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq

volumes:
  shared_data: