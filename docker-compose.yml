services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always
    # Added healthcheck to verify RabbitMQ is actually ready
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build: .
    image: discord-tts-app:latest
    volumes:
      - ./voices:/app/voices
      - shared_data:/app/shared
      - bot_db:/app/data
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always
    command: python -m bot.main

  worker:
    image: discord-tts-app:latest
    volumes:
      - ./voices:/app/voices
      - shared_data:/app/shared
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always
    command: celery -A worker.tasks worker --loglevel=info --concurrency=1
  
  webui:
    image: discord-tts-app:latest
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./voices:/app/voices
      - shared_data:/app/shared
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  shared_data:
  bot_db: