[project]
name = "discord-tts"
version = "0.1.0"
description = "A Discord TTS using pocket-tts that clones voices."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.2",
    "celery-types>=0.24.0",
    "discord-py[voice]>=2.7.1",
    "emoji>=2.15.0",
    "fastapi>=0.128.0",
    "pocket-tts>=2.1.0",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.22",
    "redis>=7.1.1",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = ["ruff>=0.15.5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
