[project]
name = "discord-tts"
version = "1.0.0"
description = "A Discord TTS using pocket-tts that clones voices."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.2",
    "celery-types>=0.24.0",
    "discord-py[voice]>=2.7.1",
    "django>=6.0.6",
    "django-extensions>=4.1",
    "django-stubs[compatible-mypy]>=6.0.6",
    "emoji>=2.15.0",
    "pocket-tts>=2.1.0",
    "pydub>=0.25.1",
    "redis>=8.0.1",
    "scipy>=1.17.0",
    "soundfile>=0.14.0",
    "torch>=2.10.0",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.40.0",
    "huggingface-hub>=1.3.7",
]

[dependency-groups]
dev = [
    "django-coverage-plugin>=3.2.2",
    "djlint>=1.40.3",
    "flower>=2.0.1",
    "honcho>=2.0.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["*/migrations/*.py", "staticfiles/*"]

lint.select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "DJ",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FLY",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "N",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
lint.ignore = [
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "SIM102", # sometimes it's better to nest
    # of types for comparison.
    # Deactivated because it can make the code slow:
    # https://github.com/astral-sh/ruff/issues/7871
]

[tool.ruff.lint.isort]
known-first-party = ["discord_tts"]
combine-as-imports = true
split-on-trailing-comma = false
force-single-line = true

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest]
addopts = ["--ds=config.settings", "--reuse-db", "--import-mode=importlib"]
minversion = "9.0"
python_files = ["tests.py", "test_*.py"]

[tool.coverage.run]
include = ["discord_tts/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]


[tool.djlint]
profile = "jinja"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
ignore_blocks = "raw"
# TODO: remove T002 when fixed https://github.com/Riverside-Healthcare/djLint/issues/687
ignore = "H006,H030,H031,T002,T028"
css.indent_size = 2
js.indent_size = 2
